  <g>
    <rect x="504" y="104" width="28" height="28" fill="none" stroke="#1B2A2C" stroke-width="4"/>
    <path d="M509 118 l8 9 15-18" fill="none" stroke="#4B3F8F" stroke-width="6" stroke-linecap="square"/>
    <path d="M548 118 H700" stroke="#1B2A2C" stroke-width="6"/>
