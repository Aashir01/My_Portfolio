<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Candlestick chart filtered by a macroeconomic evidence curve">
  <defs>
    <pattern id="fDots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#1B2A2C" opacity="0.24"/>
    </pattern>
  </defs>
  <rect width="800" height="420" fill="#D6DACD"/>
  <rect width="800" height="420" fill="url(#fDots)"/>

  <!-- plot frame + gridlines -->
  <rect x="62" y="52" width="676" height="292" fill="none" stroke="#1B2A2C" stroke-width="4"/>
  <g stroke="#1B2A2C" stroke-width="1.5" opacity="0.28">
    <path d="M62 124 H738 M62 198 H738 M62 272 H738"/>
  </g>

  <!-- macro evidence band -->
  <path d="M62 268 C 180 232, 240 300, 340 244 S 520 128, 620 168 S 720 116, 738 100
           L738 172 C 720 190, 660 234, 620 236 S 520 200, 340 314 S 180 300, 62 320 Z"
        fill="#4B3F8F" opacity="0.16"/>
  <path d="M62 294 C 180 266, 240 300, 340 279 S 520 164, 620 202 S 720 130, 738 136"
        fill="none" stroke="#4B3F8F" stroke-width="5"/>

  <!-- candles -->
  <g stroke="#1B2A2C" stroke-width="3">
    <path d="M110 176 V286" /><rect x="98" y="200" width="24" height="58" fill="#1B2A2C"/>
    <path d="M162 156 V266" /><rect x="150" y="182" width="24" height="60" fill="#D6DACD"/>
    <path d="M214 190 V300" /><rect x="202" y="214" width="24" height="62" fill="#BE3A2B"/>
    <path d="M266 152 V262" /><rect x="254" y="176" width="24" height="56" fill="#D6DACD"/>
    <path d="M318 178 V292" /><rect x="306" y="200" width="24" height="66" fill="#1B2A2C"/>
    <path d="M370 140 V254" /><rect x="358" y="164" width="24" height="62" fill="#D6DACD"/>
    <path d="M422 168 V282" /><rect x="410" y="192" width="24" height="64" fill="#BE3A2B"/>
    <path d="M474 120 V236" /><rect x="462" y="146" width="24" height="62" fill="#D6DACD"/>
    <path d="M526 146 V258" /><rect x="514" y="170" width="24" height="60" fill="#1B2A2C"/>
    <path d="M578 100 V214" /><rect x="566" y="124" width="24" height="62" fill="#D6DACD"/>
    <path d="M630 126 V240" /><rect x="618" y="150" width="24" height="58" fill="#1B2A2C"/>
    <path d="M682 84 V196" /><rect x="670" y="108" width="24" height="60" fill="#D6DACD"/>
  </g>

  <!-- confirmed signal marker -->
  <g>
    <circle cx="682" cy="138" r="30" fill="none" stroke="#BE3A2B" stroke-width="6"/>
    <path d="M664 138 l12 13 24-28" fill="none" stroke="#BE3A2B" stroke-width="7" stroke-linecap="square"/>
  </g>
  <!-- rejected setup marker -->
  <g opacity="0.85">
    <circle cx="214" cy="244" r="26" fill="none" stroke="#1B2A2C" stroke-width="5" stroke-dasharray="7 7"/>
    <path d="M198 228 l32 32" stroke="#1B2A2C" stroke-width="5"/>
  </g>

  <text x="738" y="378" text-anchor="end" font-family="'Courier Prime',monospace" font-size="15" letter-spacing="3" fill="#1B2A2C" opacity="0.72">PATTERN &#215; MACRO EVIDENCE</text>
  <path d="M62 344 H738" stroke="#1B2A2C" stroke-width="4"/>
</svg>
